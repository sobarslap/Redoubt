name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege token for third-party actions and downloaded tools.
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: uv python install 3.11
      - name: Sync (core + dev)
        run: uv sync --group dev
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
      - name: Dependency CVE scan (pip-audit)
        run: uvx pip-audit --strict --progress-spinner off
      - name: Generate SBOM (CycloneDX)
        run: uvx cyclonedx-py environment --output-format json --outfile sbom.json || true
      - name: Format check
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy
      - name: Unit + integration tests
        run: uv run pytest tests/unit tests/integration
      - name: Adversarial (red-team) tests
        run: uv run pytest tests/adversarial
      - name: Golden dataset eval gate
        run: uv run python -m evals.run
      - name: End-to-end (golden dataset) tests
        run: uv run pytest tests/e2e
      - name: Performance benchmark (proves the baseline→AegisMem deltas)
        run: uv run python -m benchmarks.run --scales 10,1000,100000,1000000
      # A dropped faithfulness/task-completion score, a risen attack-success-rate, or a
      # blown P95/token budget fails the pipeline.
