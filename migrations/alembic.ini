# Alembic config for the AegisMem pgvector backend (Production Phase P6/P8).
# Apply against production Postgres:  cd migrations && alembic upgrade head
# The DSN comes from AEGISMEM_PG_DSN / DATABASE_URL (resolved in env.py), never
# hard-coded here (keeps the P4 secret scan clean).
[alembic]
script_location = %(here)s
prepend_sys_path = .
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
