# Provider-agnostic model routing. The LLMClient abstraction resolves a role to a
# concrete provider+model. Default workhorse = Gemini; hard reasoning / eval judge = Claude;
# fully-offline demo path = Ollama. No paid OpenAI dependency anywhere.

roles:
  workhorse:
    provider: gemini
    model: gemini-2.5-flash
  reasoning:
    provider: claude
    model: claude-opus-5
  judge:
    provider: claude
    model: claude-sonnet-5
  offline:
    provider: ollama
    model: qwen2.5

# Fallback chain used by the failure policy (llm_request: retry_then_fallback).
fallback_chain: [gemini, claude, ollama]

# Local (free) models — no API key required.
local:
  embeddings: BAAI/bge-small-en-v1.5
  reranker: BAAI/bge-reranker-base
  pi_classifier: protectai/deberta-v3-base-prompt-injection
